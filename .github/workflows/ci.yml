name: devops

on:
    push:
        branches: [main]

    pull_request:
        branches: [main]

    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: test javascript application
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: setup nodejs
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: install dependencies
              run: npm install

            - name: run automated tests
              run: npm test

            - name: run application
              run: npm start
